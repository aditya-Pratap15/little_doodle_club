name: Little Doodle Club - Daily Tutorial Automation

on:
  schedule:
    # Runs ONCE daily at 10:00 AM UTC (06:00 AM EDT / 03:30 PM IST)
    # Fetches 3 tutorials from Drive, watermarks them, and schedules them into
    # Facebook Page Planner across 3 peak USA hours (08:30 AM, 01:30 PM, 06:30 PM EDT)
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      post_count:
        description: 'Number of unposted images to fetch and schedule (default: 3)'
        required: false
        default: '3'

permissions:
  contents: write

jobs:
  doodle-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify FFmpeg
        run: ffmpeg -version

      - name: Fetch 3 Random Diverse Tutorials from Google Drive
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          POST_COUNT: ${{ github.event.inputs.post_count || '3' }}
        run: node scripts/fetch_from_drive.js

      - name: Apply Centered Watermark & Generate Captions
        run: node scripts/watermark_studio.js

      - name: Schedule 3 Posts into Facebook Page Planner (USA Timing)
        env:
          FB_PAGE_ID_DOODLE: ${{ secrets.FB_PAGE_ID_DOODLE || '1298820806658884' }}
          FB_TOKEN_DOODLE: ${{ secrets.FB_TOKEN_DOODLE || 'EAAUbRaJrCqMBSsxLPkyloZCf0hX0xIXRXxiR4nX5ZB16Ht27oZAvTB1IcwEZCVLkGjtwab8PZCJ5SP9tNUtqW2ZBdSZBF7BM0wqdz8VhK1GAgRGbh346Y6Apz3iMpt4ZA4YuiGKWsqwGxwUo79i1FomiXruz0gZB3ga9rmi6mHFDGxGXlwMVuCZCJdy2X3KoWsbyuK19HmbZCEZB' }}
        run: node scripts/post_to_facebook.js

      - name: Commit State & History to Git
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add state.json today_doodles.json fetched_doodles.json branded_doodles/ incoming_doodles/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-progress: tutorials scheduled into Facebook Planner [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main || true
              git push origin main && break || sleep 2
            done
          else
            echo "No changes to commit."
          fi
