name: Little Doodle Club - Daily Tutorial Automation

on:
  schedule:
    # RUN 1 (Morning Inspiration): 12:30 UTC = 08:30 AM EDT / 06:00 PM IST
    # -> Uploads all 3 tutorials: Post 1 LIVE + comment, Posts 2 & 3 scheduled into Facebook Page Planner!
    - cron: '30 12 * * *'

    # RUN 2 (Afternoon Comment Drop): 17:35 UTC = 01:35 PM EDT / 11:05 PM IST
    # -> Wakes up 5 mins after Post 2 goes live to drop Follow Comment 2! (Takes ~5 seconds)
    - cron: '35 17 * * *'

    # RUN 3 (Evening Comment Drop): 22:35 UTC = 06:35 PM EDT / 04:05 AM IST (+1)
    # -> Wakes up 5 mins after Post 3 goes live to drop Follow Comment 3! (Takes ~5 seconds)
    - cron: '35 22 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode: "pipeline" (fetch + schedule all 3) or "comments" (drop pending comments)'
        required: false
        default: 'pipeline'

permissions:
  contents: write

jobs:
  doodle-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine Run Mode
        id: run_mode
        run: |
          INPUT_MODE="${{ github.event.inputs.mode }}"
          if [ -n "$INPUT_MODE" ]; then
            echo "mode=$INPUT_MODE" >> $GITHUB_OUTPUT
          else
            MODE=$(node -e '
              const fs = require("fs");
              try {
                const state = JSON.parse(fs.readFileSync("state.json", "utf8"));
                const today = new Date().toISOString().slice(0, 10);
                if (state.lastPipelineDate !== today) {
                  console.log("pipeline");
                } else {
                  console.log("comments");
                }
              } catch(e) {
                console.log("pipeline");
              }
            ')
            echo "Determined mode: $MODE"
            echo "mode=$MODE" >> $GITHUB_OUTPUT
          fi

      # -------------------------------------------------------------
      # MORNING RUN: Full Pipeline (Fetch 3, Watermark, Schedule, Post 1 Live)
      # -------------------------------------------------------------
      - name: Verify FFmpeg
        if: steps.run_mode.outputs.mode == 'pipeline'
        run: ffmpeg -version

      - name: Fetch 3 Random Diverse Tutorials from Google Drive
        if: steps.run_mode.outputs.mode == 'pipeline'
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          POST_COUNT: '3'
        run: node scripts/fetch_from_drive.js

      - name: Apply Centered Watermark & Generate Captions
        if: steps.run_mode.outputs.mode == 'pipeline'
        run: node scripts/watermark_studio.js

      - name: Upload Post 1 LIVE + Schedule Posts 2 & 3 in Facebook Planner
        if: steps.run_mode.outputs.mode == 'pipeline'
        env:
          FB_PAGE_ID_DOODLE: ${{ secrets.FB_PAGE_ID_DOODLE || '1298820806658884' }}
          FB_TOKEN_DOODLE: ${{ secrets.FB_TOKEN_DOODLE || 'EAAUbRaJrCqMBSsxLPkyloZCf0hX0xIXRXxiR4nX5ZB16Ht27oZAvTB1IcwEZCVLkGjtwab8PZCJ5SP9tNUtqW2ZBdSZBF7BM0wqdz8VhK1GAgRGbh346Y6Apz3iMpt4ZA4YuiGKWsqwGxwUo79i1FomiXruz0gZB3ga9rmi6mHFDGxGXlwMVuCZCJdy2X3KoWsbyuK19HmbZCEZB' }}
        run: node scripts/post_to_facebook.js

      # -------------------------------------------------------------
      # AFTERNOON & EVENING RUNS: Lightweight Comment Dropper (~5s)
      # -------------------------------------------------------------
      - name: Drop Pending Follow Comments on Live Posts
        if: steps.run_mode.outputs.mode == 'comments'
        env:
          FB_PAGE_ID_DOODLE: ${{ secrets.FB_PAGE_ID_DOODLE || '1298820806658884' }}
          FB_TOKEN_DOODLE: ${{ secrets.FB_TOKEN_DOODLE || 'EAAUbRaJrCqMBSsxLPkyloZCf0hX0xIXRXxiR4nX5ZB16Ht27oZAvTB1IcwEZCVLkGjtwab8PZCJ5SP9tNUtqW2ZBdSZBF7BM0wqdz8VhK1GAgRGbh346Y6Apz3iMpt4ZA4YuiGKWsqwGxwUo79i1FomiXruz0gZB3ga9rmi6mHFDGxGXlwMVuCZCJdy2X3KoWsbyuK19HmbZCEZB' }}
        run: node scripts/post_pending_comments.js

      # -------------------------------------------------------------
      # Commit State & History back to Git
      # -------------------------------------------------------------
      - name: Commit State & History to Git
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add -A state.json today_doodles.json fetched_doodles.json branded_doodles/ incoming_doodles/ 2>/dev/null || git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-progress: pipeline state updated [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main || true
              git push origin main && break || sleep 2
            done
          else
            echo "No changes to commit."
          fi